# agni reads this file from the checkout, so `agni serve` and `agni check mount://boards/<board>` work
# here with no flags. It may use only the keys every released agni knows (mounts, symbol_paths,
# web_dir, native_tools), because an agni that meets an unknown key refuses to start.
#
# house is a team's own boards (house/README.md). make's HOUSE_DIR moves it for the make targets.
mounts:
  boards: boards
  odb: odb
  cadence: cadence
  house: house
