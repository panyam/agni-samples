name: verify

on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The tree checks and verify's own test, with no agni.
  tree:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make verify
      - run: make test

  # Reads every design with the oldest agni the README supports. Raise AGNI_VERSION when the README
  # raises that floor.
  read:
    runs-on: ubuntu-latest
    env:
      AGNI_VERSION: v0.6.0
    steps:
      - uses: actions/checkout@v4
      - name: Fetch agni
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download "$AGNI_VERSION" -R panyam/agni -p "agni_${AGNI_VERSION}_linux_amd64.tar.gz" -D "$RUNNER_TEMP"
          tar -xzf "$RUNNER_TEMP/agni_${AGNI_VERSION}_linux_amd64.tar.gz" -C "$RUNNER_TEMP"
          echo "AGNI=$(find "$RUNNER_TEMP" -type f -name agni)" >> "$GITHUB_ENV"
      # The boards remote/remote.pin fetches from their publishers, kept between runs by the pin's
      # hash, so a run downloads them only when the pin changes.
      - uses: actions/cache@v4
        with:
          path: ~/.cache/agni/samples
          key: remote-boards-${{ hashFiles('remote/remote.pin') }}
      - run: make remote
      - run: make verify AGNI="$AGNI"
      - run: make test AGNI="$AGNI"
      # Every analysis target on Glasgow, so a target whose agni flags change fails here first.
      - run: make tour AGNI="$AGNI"
