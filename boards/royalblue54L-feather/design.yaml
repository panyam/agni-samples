# Added by agni, not part of the upstream design (see PROVENANCE.md). It names the file analysis
# reads, and declares which connectors are internal to the product.
#
# The board file is not declared as a companion, because RoyalBlue54L-Feather.kicad_pcb is
# malformed. An expression closes the file at line 627, and the rest sits outside it (agni issue
# 681). If a declared companion doesn't parse, every read of the design fails. Until the board file
# reads, this design has no board tier, and agni says which board rules didn't run.
name: royalblue54l-feather
title: RoyalBlue54L Feather
entry: RoyalBlue54L-Feather.kicad_sch

# The person using a Feather handles its headers, its USB-C port and its STEMMA QT port. So those
# are left undeclared, and the exposure rules check them.
intent:
  components:
    J4: {exposure: internal}   # battery connector, the cell sits with the board
    J6: {exposure: internal}   # NFC antenna connector, cabled to the antenna flex
