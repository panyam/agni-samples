# Added by agni, not part of the upstream design (see PROVENANCE.md). It matches rev 1.1.0's
# descriptor in boards/jetson-agx-thor-baseboard, so the two revisions are read the same way and a
# diff shows only what Antmicro changed. It names the file analysis reads, and the file that holds
# the same board's copper. It also declares which connectors are internal to the product, so agni
# reads the board the way it would read a team's own declared design.
name: jetson-agx-thor-baseboard-1.1.2
title: Jetson AGX Thor baseboard, rev 1.1.2
entry: jetson-agx-thor-baseboard.kicad_sch
companions:
  - jetson-agx-thor-baseboard.kicad_pcb

# agni treats every connector as a way into the board unless it's declared otherwise. That's right
# for a cable entry and wrong for a module socket. The connectors below join this board to another
# part of the same product. The USB-C ports, the SFP cage, the power entry and the two JST-SH I2C
# ports are left undeclared, because a user plugs cables into them.
intent:
  components:
    J1:  {exposure: internal}   # Jetson AGX Thor module, board-to-board
    J8:  {exposure: internal}   # FMC+ expansion power, mates with J18's accessory
    J18: {exposure: internal}   # FMC+ expansion mezzanine
    J13: {exposure: internal}   # M.2 key-M, NVMe card
    J14: {exposure: internal}   # M.2 key-E, wireless card
    J10: {exposure: internal}   # CSI camera FFC, cabled to a camera inside the product
    J11: {exposure: internal}   # CSI camera FFC
    J15: {exposure: internal}   # fan
    J4:  {exposure: internal}   # Tag-Connect debug pads, used in manufacturing
    J20: {exposure: internal}   # Tag-Connect debug pads
