# A review checklist for the public boards. They belong to no project, so `make review` names this
# file. A house board's project can carry its own (house/_template/project.yaml.example).
#
# Each item is bound to one agni rule, to an inline query, or to nothing. agni reports an item bound
# to nothing as not automated. So the coverage counts what was asked, as well as what was answered.
name: Public board review
areas:
  - name: Power
    items:
      - {id: P1, title: every rail carries decoupling, rule: decoupling-present}
      - {id: P2, title: every rail carries a bulk capacitor, rule: bulk-cap}
      - {id: P3, title: the input is protected against reverse polarity, rule: reverse-blocking-absent}
  - name: Interfaces
    items:
      - {id: I1, title: every I2C bus has pull-ups, rule: i2c-pull-up}
      - {id: I2, title: exposed signals have ESD protection, rule: esd-protection}
      - {id: I3, title: no two parts drive one net, rule: output-output-conflict}
  - name: Board
    items:
      - {id: B1, title: no track is below the board's minimum width, rule: track-width}
  - name: House rules
    items:
      - id: H1
        title: every test point sits on a named net
        query:
          match: 'component.class(?r, "test_point"), pin.net(?r, ?p, ?n), str.prefix(?n, "Net-(") => ?r, ?n'
          subject: r
          message: '{r} probes {n}, a net nobody named'
      - {id: H2, title: the schematic matches the block diagram}
